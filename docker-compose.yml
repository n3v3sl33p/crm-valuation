services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: valuation-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/valuation.db:/app/valuation.db
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: valuation-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

